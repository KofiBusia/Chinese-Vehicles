<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — {{ business.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f1117,#1a1d27);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .wrap{background:#1a1d27;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2.5rem;width:100%;max-width:400px;}
    .logo{text-align:center;margin-bottom:2rem;}
    .logo img{height:48px;width:auto;border-radius:6px;margin:0 auto .75rem;}
    .logo p{font-size:.82rem;color:rgba(255,255,255,.4);margin-top:.25rem;}
    .form-group{margin-bottom:1.25rem;}
    label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.7);display:block;margin-bottom:.4rem;}
    input{width:100%;padding:.8rem 1rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:white;font-size:.9rem;font-family:inherit;transition:border-color .2s;}
    input:focus{outline:none;border-color:#33CC00;background:rgba(51,204,0,.08);}
    input::placeholder{color:rgba(255,255,255,.25);}
    .btn{width:100%;padding:.9rem;background:#33CC00;color:white;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:.5rem;}
    .btn:hover{background:#28A800;}
    .flash{padding:.75rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;}
    .flash.error{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
    .flash.success{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.25);}
    .links{text-align:center;margin-top:1.5rem;font-size:.82rem;color:rgba(255,255,255,.35);}
    .links a{color:#55E600;}
    .strength{height:4px;border-radius:2px;margin-top:.5rem;background:rgba(255,255,255,.1);transition:all .3s;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="{{ url_for('static', filename='img/galaxy-logo.png') }}" alt="{{ business.name }}">
      <p>Salesperson Portal</p>
    </div>

    <h2 style="color:white;font-family:'Poppins',sans-serif;font-size:1.1rem;margin-bottom:.4rem;text-align:center;">Set New Password</h2>
    <p style="font-size:.82rem;color:rgba(255,255,255,.4);text-align:center;margin-bottom:1.5rem;">Choose a strong password for your account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('sales_reset_password', token=token) }}">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" id="pw" required autofocus placeholder="Min. 6 characters" oninput="checkStrength(this.value)">
        <div class="strength" id="strength-bar"></div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="password2" required placeholder="Repeat password">
      </div>
      <button type="submit" class="btn">Update Password →</button>
    </form>

    <div class="links">
      <a href="{{ url_for('sales_login') }}">← Back to login</a>
    </div>
  </div>
  <script>
  function checkStrength(pw) {
    var bar = document.getElementById('strength-bar');
    if (!pw) { bar.style.width='0'; return; }
    var score = 0;
    if (pw.length >= 6)  score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    var colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
    bar.style.width = (score * 20) + '%';
    bar.style.background = colors[score - 1] || '#ef4444';
  }
  </script>
</body>
</html>
