<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — {{ business.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f1117;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .login-wrap {
      background: #1a1d27;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%; max-width: 400px;
    }
    .login-logo {
      text-align: center; margin-bottom: 2rem;
    }
    .login-logo .icon { font-size: 2.5rem; }
    .login-logo h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem; font-weight: 800;
      color: white; margin-top: .5rem;
    }
    .login-logo p { font-size: .82rem; color: rgba(255,255,255,.4); margin-top: .25rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { font-size: .8rem; font-weight: 600; color: rgba(255,255,255,.7); display: block; margin-bottom: .4rem; }
    .form-control {
      width: 100%; padding: .8rem 1rem;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px; color: white; font-size: .9rem; font-family: inherit;
      transition: border-color .2s;
    }
    .form-control:focus { outline: none; border-color: #3b82f6; background: rgba(59,130,246,.08); }
    .form-control::placeholder { color: rgba(255,255,255,.25); }
    .btn-login {
      width: 100%; padding: .9rem;
      background: #3b82f6; color: white;
      border: none; border-radius: 8px;
      font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .2s;
      margin-top: .5rem;
    }
    .btn-login:hover { background: #2563eb; }
    .flash { padding: .75rem 1rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1rem; }
    .flash.error { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .flash.success { background: rgba(34,197,94,.15); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
    .back-link { text-align: center; margin-top: 1.5rem; font-size: .82rem; color: rgba(255,255,255,.35); }
    .back-link a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="icon">⚡</div>
      <h1>{{ business.name }}</h1>
      <p>Admin Portal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login">Sign In →</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('index') }}">← Back to website</a>
    </div>
  </div>
</body>
</html>
